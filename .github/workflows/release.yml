name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (for example 1.0.0). Defaults to the version in the project file.'
        required: false

permissions:
  contents: write
  # Required by NuGet/login@v1: GitHub issues an OIDC token that nuget.org exchanges for a
  # short-lived API key, so no long-lived NuGet secret is stored in the repository.
  id-token: write
  # Required to mirror the package into GitHub Packages with the workflow token.
  packages: write

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # A tag such as v1.0.0 publishes 1.0.0; a manual run can pass the version explicitly.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version=""
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${version:-<project default>}"

      - name: Restore
        run: dotnet restore SiameseCat.slnx

      - name: Build
        run: dotnet build SiameseCat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SiameseCat.slnx --configuration Release --no-build

      - name: Framework matrix
        run: |
          dotnet build tests/SiameseCat.FrameworkMatrix/SiameseCat.FrameworkMatrix.csproj --configuration Release --no-restore
          dotnet run --project tests/SiameseCat.FrameworkMatrix/SiameseCat.FrameworkMatrix.csproj --configuration Release --no-build --framework net8.0
          dotnet run --project tests/SiameseCat.FrameworkMatrix/SiameseCat.FrameworkMatrix.csproj --configuration Release --no-build --framework net10.0

      - name: Pack
        shell: bash
        run: |
          version_args=()
          if [[ -n "${{ steps.version.outputs.version }}" ]]; then
            version_args=(-p:Version="${{ steps.version.outputs.version }}" -p:PackageValidationBaselineVersion=)
          fi
          for project in Core Tcp Modbus S7 Simulation.Modbus Simulation.S7 Hosting All; do
            dotnet pack "src/SiameseCat.Communication.$project/SiameseCat.Communication.$project.csproj" \
              --configuration Release --no-build --output artifacts "${version_args[@]}"
          done

      - name: Verify package layout
        shell: bash
        run: |
          for pkg in artifacts/*.nupkg; do
            for tfm in net8.0 net10.0 netstandard2.0; do
              unzip -l "$pkg" | grep -q "lib/$tfm/" || { echo "::error::$pkg is missing lib/$tfm"; exit 1; }
            done
            unzip -l "$pkg" | grep -q 'README.md' || { echo "::error::$pkg is missing README.md"; exit 1; }
          done

      # The GitHub Packages mirror uses the workflow token, so a release exists even when NuGet.org
      # is unavailable or its Trusted Publishing policy needs attention.
      - name: Push to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push artifacts/SiameseCat.Communication.*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate

      - name: Check NUGET_USER
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::NUGET_USER is not set. Add the repository variable NUGET_USER (Settings -> Secrets and variables -> Actions -> Variables) with your nuget.org profile name."
            exit 1
          fi
          echo "Publishing to nuget.org as $NUGET_USER"

      # Trusted Publishing: nuget.org validates the OIDC token against the policy registered for
      # this repository + workflow file and returns a temporary API key valid for one hour.
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org profile name (username), not the email address. Set it as the repository
          # variable NUGET_USER (a secret with the same name works too).
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "::error::NuGet/login returned no API key. Check the Trusted Publishing policy (owner, repository, workflow file release.yml, scope, glob pattern)."
            exit 1
          fi

          for pkg in artifacts/*.nupkg artifacts/*.snupkg; do
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*.nupkg artifacts/*.snupkg \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            --verify-tag

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
