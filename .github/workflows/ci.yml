name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SiameseCat.slnx

      - name: Build
        run: dotnet build SiameseCat.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test SiameseCat.slnx --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory test-results
          --logger "trx;LogFileName=test-results.trx"

      - name: Check line coverage
        shell: pwsh
        run: |
          $report = Get-ChildItem test-results -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $report) { throw "No coverage report was produced." }
          [xml] $coverage = Get-Content $report.FullName
          $lineRate = [double] $coverage.coverage.'line-rate'
          Write-Host ("Line coverage: {0:P1}" -f $lineRate)
          if ($lineRate -lt 0.75) { throw ("Line coverage {0:P1} is below the 75% gate." -f $lineRate) }

      - name: Pack
        run: dotnet pack src/SiameseCat.Communication/SiameseCat.Communication.csproj --configuration Release --no-build --output artifacts

      - name: Verify package layout
        run: |
          for pkg in artifacts/*.nupkg; do
            for tfm in net8.0 net10.0 netstandard2.0; do
              unzip -l "$pkg" | grep -q "lib/$tfm/" || { echo "::error::$pkg is missing lib/$tfm"; exit 1; }
            done
            unzip -l "$pkg" | grep -q 'README.md' || { echo "::error::$pkg is missing README.md"; exit 1; }
          done

      - name: Verify documentation links
        shell: pwsh
        run: |
          $docs = Select-String -Path README.md -Pattern 'blob/main/(docs/[a-z-]+\.md)' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if (-not $docs) { throw "README.md does not link to any docs file." }
          foreach ($doc in $docs) {
            if (-not (Test-Path $doc)) { throw "README.md links to missing $doc." }
          }
          Write-Host ("Documentation links OK: {0}" -f ($docs -join ", "))

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/**/*.trx
            test-results/**/coverage.cobertura.xml

  soak:
    name: Soak (fault injection)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run the soak test
        run: >
          dotnet run --project tools/SiameseCat.Soak --configuration Release
          -- --duration 00:01:00 --workers 4 --fault-period 00:00:10 --fault-duration 00:00:02

  framework-matrix:
    name: Framework matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build the matrix runner
        run: dotnet build tests/SiameseCat.FrameworkMatrix/SiameseCat.FrameworkMatrix.csproj --configuration Release

      - name: Run on .NET 8
        run: dotnet run --project tests/SiameseCat.FrameworkMatrix/SiameseCat.FrameworkMatrix.csproj --configuration Release --no-build --framework net8.0

      - name: Run on .NET 10
        run: dotnet run --project tests/SiameseCat.FrameworkMatrix/SiameseCat.FrameworkMatrix.csproj --configuration Release --no-build --framework net10.0

  dotnet-framework:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET Framework compatibility runner
        run: dotnet run --project tests/SiameseCat.Compatibility/SiameseCat.Compatibility.csproj --configuration Release

  native-aot:
    name: Native AOT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine runtime identifier
        id: rid
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Windows-X64)   rid=win-x64;   exe=SiameseCat.AotProbe.exe ;;
            Windows-ARM64) rid=win-arm64; exe=SiameseCat.AotProbe.exe ;;
            Linux-X64)     rid=linux-x64; exe=SiameseCat.AotProbe ;;
            Linux-ARM64)   rid=linux-arm64; exe=SiameseCat.AotProbe ;;
            macOS-X64)     rid=osx-x64;   exe=SiameseCat.AotProbe ;;
            macOS-ARM64)   rid=osx-arm64; exe=SiameseCat.AotProbe ;;
            *) echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
          echo "executable=$exe" >> "$GITHUB_OUTPUT"

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        run: dotnet publish tools/SiameseCat.AotProbe/SiameseCat.AotProbe.csproj --configuration Release --runtime ${{ steps.rid.outputs.rid }} -p:StripSymbols=true --output artifacts-aot

      - name: Run AOT probe
        shell: bash
        run: ./artifacts-aot/${{ steps.rid.outputs.executable }}

  native-aot-cross:
    name: Native AOT cross-compilation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cross publish all supported RIDs
        run: bash scripts/publish-aot.sh all

      - name: Run Linux probes in Docker
        run: |
          bash scripts/run-aot-docker.sh linux-x64
          bash scripts/run-aot-docker.sh linux-musl-x64
